# =============================================================================
#  os.conf — the one file that defines this distribution's identity.
#
#  Change these values and rebuild; build.sh substitutes them everywhere
#  (@OS_NAME@ tokens inside files, __OS_ID__ inside file names).
# =============================================================================

# Human-friendly name shown to users (welcome screen, ISO label, etc.)
OS_NAME="Waypoint"

# Short machine-friendly id: lowercase letters, digits and dashes only.
# Used for file names (e.g. /usr/local/bin/<id>-welcome) and the hostname.
OS_ID="waypoint"

# Version of *this* distribution (not Debian's).
OS_VERSION="0.1.0"

# Project home page (shown in the welcome app and the release file).
OS_HOMEPAGE="https://github.com/chrisdburk/Operating_System"

# Debian release we build on. "trixie" = Debian 13 (current stable).
DEBIAN_SUITE="trixie"

# CPU architecture. amd64 covers virtually every Windows PC from the last 15 years.
ARCH="amd64"

# Debian mirror used during the build and written into the installed system.
DEBIAN_MIRROR="http://deb.debian.org/debian/"
