# @OS_NAME@ boot defaults for the installed system.
#
# "quiet" alone still prints kernel messages of level "error", which are
# usually harmless (e.g. virtual-machine graphics warnings) but alarming to
# new users. loglevel=3 hides them; they remain available via `journalctl -k`.
#
# This file is read after /etc/default/grub, so we *append* to the options
# the installer wrote there (disk encryption, resume, etc.) instead of
# replacing them. Run `sudo update-grub` after editing.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT loglevel=3"
