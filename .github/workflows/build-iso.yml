name: Build ISO

# Builds take ~30-60 minutes, so this runs on demand (Actions tab ->
# "Build ISO" -> "Run workflow") and on version tags like v0.1.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build ISO in Debian container
        run: ./build-in-docker.sh build

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: iso
          path: |
            out/*.iso
            out/*.sha256
          compression-level: 0
          retention-days: 14
